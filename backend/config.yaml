# LLM profiles. Pick one with LLM_PROFILE=<name> (env or backend/.env); falls back to default_profile.
# provider: anthropic | openai_chat | openai_responses
# openai_chat + base_url covers any OpenAI-compatible server (DeepSeek, OpenRouter, Ollama, vLLM...).

default_profile: claude

# search_knowledge embeddings (the index in data/knowledge.json is built with the same model:
# uv --project backend run python scripts/build_knowledge.py). Multilingual: English queries, Chinese text.
embeddings:
  model: bge-m3
  base_url: http://localhost:11435/v1
  api_key_env: OLLAMA_API_KEY

profiles:
  claude:
    provider: anthropic
    model: claude-opus-5
    api_key_env: ANTHROPIC_API_KEY
    # effort: medium          # low | medium | high | xhigh | max (unset = API default "high")
    fallbacks: default        # server-side retry on another model if a request is declined; set null to disable

  claude-sonnet:
    provider: anthropic
    model: claude-sonnet-5
    api_key_env: ANTHROPIC_API_KEY
    fallbacks: null

  gpt-responses:
    provider: openai_responses
    model: gpt-5
    api_key_env: OPENAI_API_KEY
    # reasoning_effort: medium

  gpt-chat:
    provider: openai_chat
    model: gpt-5
    api_key_env: OPENAI_API_KEY

  # xAI Grok over its OpenAI-compatible API (XAI_API_KEY). grok-4.6 is the more token-efficient one.
  grok:
    provider: openai_chat
    model: grok-4.6
    base_url: https://api.x.ai/v1
    api_key_env: XAI_API_KEY

  grok-4.7:
    provider: openai_chat
    model: grok-4.7
    base_url: https://api.x.ai/v1
    api_key_env: XAI_API_KEY

  grok-responses:
    provider: openai_responses
    model: grok-4.6
    base_url: https://api.x.ai/v1
    api_key_env: XAI_API_KEY

  # OpenRouter (OPENROUTER_API_KEY): one key, many models, over the OpenAI-compatible chat API.
  # IDs from https://openrouter.ai/api/v1/models (checked 2026-09-28). or-grok is the model the harness was tested on.
  or-grok:
    provider: openai_chat
    model: x-ai/grok-4.6
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY

  or-sonnet:
    provider: openai_chat
    model: anthropic/claude-sonnet-5
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY

  or-gemini-flash:
    provider: openai_chat
    model: google/gemini-3.8-flash
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY

  or-gpt:
    provider: openai_chat
    model: openai/gpt-5.6-sol
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY

  or-deepseek:
    provider: openai_chat
    model: deepseek/deepseek-v4.1-flash
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY

  # Local models: start the server with scripts/ollama_serve.sh (port 11435, 32k context).
  ollama:
    provider: openai_chat
    model: qwen3:8b
    base_url: http://localhost:11435/v1
    api_key_env: OLLAMA_API_KEY   # any non-empty value; Ollama ignores it
    max_tokens_param: max_tokens
    reasoning_effort: none        # qwen3 thinking off: ~3x faster, and fewer empty turns

  ollama-think:
    provider: openai_chat
    model: qwen3:8b
    base_url: http://localhost:11435/v1
    api_key_env: OLLAMA_API_KEY
    max_tokens_param: max_tokens

  ollama-14b:
    provider: openai_chat
    model: qwen3:14b
    base_url: http://localhost:11435/v1
    api_key_env: OLLAMA_API_KEY
    max_tokens_param: max_tokens
    reasoning_effort: none

  openrouter:
    provider: openai_chat
    model: deepseek/deepseek-chat
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    max_tokens_param: max_tokens
